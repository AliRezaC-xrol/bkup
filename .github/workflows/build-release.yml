name: Build pre-built release asset

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.3.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create an empty database
        run: |
          mkdir -p db
          # Prisma resolves relative SQLite paths against prisma/schema.prisma,
          # so use an absolute path here.
          DATABASE_URL="file:$GITHUB_WORKSPACE/db/custom.db" npx prisma db push --skip-generate --accept-data-loss
          ls -l db/custom.db

      - name: Build (Next.js standalone)
        run: npm run build

      - name: Add package.json to standalone
        run: cp -a package.json .next/standalone/package.json

      - name: Package standalone
        run: |
          # a Next.js standalone bundle does NOT include public/ or .next/static
          # by itself — the installer expects a complete, runnable tree
          cp -a public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          # ship the ready-made empty DB so a fresh install needs no prisma CLI
          test -s db/custom.db
          mkdir -p .next/standalone/db
          cp -a db/custom.db .next/standalone/db/custom.db
          # name the artifact after the tag: bkup-v1.3.1.tar.gz
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cd .next/standalone
          tar -czf "../../bkup-${TAG}.tar.gz" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: bkup-*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
