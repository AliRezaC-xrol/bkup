name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:./db/custom.db

  version-guard:
    # A release tag must ALWAYS match the version in package.json — the
    # installer and updater refuse to install a release whose code version
    # doesn't match its tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag ↔ package.json version check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_V="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_V" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG_V"
            exit 1
          fi
          echo "OK: tag $TAG matches package.json $PKG_V"
