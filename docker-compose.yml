services:
  bkup:
    build: .
    image: bkup:latest
    container_name: bkup
    restart: unless-stopped
    ports:
      - "3999:3000" # web panel — reachable at http://SERVER_IP:3999
    environment:
      - TZ=Asia/Tehran
      - DATABASE_URL=file:/app/data/prod.db
      - BACKUP_DIR=/app/data/backups
    volumes:
      - ./data:/app/data
      # For "local" backup mode when the 3x-ui panel runs on this same server, uncomment this line:
      # - /etc/x-ui:/host-xui:ro
